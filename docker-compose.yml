services:
  db:
    image: postgres:17
    container_name: fila-virtual-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fila_virtual
    ports:
      - "5432:5432"
    volumes:
      - fila_virtual_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fila_virtual"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fila_virtual_pg:
