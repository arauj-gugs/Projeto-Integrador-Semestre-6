name: docs-lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            !.github/ISSUE_TEMPLATE/*.md
            !.github/pull_request_template.md
