# Blueprint Render — API Fila Virtual (#67)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fila-virtual-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run db:migrate -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      # Neon: colar connection string no painel Render (deploy.md).
      # - key: CORS_ORIGIN
      #   sync: false
      # URL(s) Vercel após o primeiro deploy do front.